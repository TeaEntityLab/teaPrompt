repos:
  - repo: local
    hooks:
      - id: make-all
        name: make all (tests + validators)
        entry: make all
        language: system
        pass_filenames: false
        files: ^(reflective-prompt-library/.*|Makefile|VERIFY\.md|acceptance\.yaml|features/.*|README[^/]*\.md|CONTRIBUTING\.md|\.github/workflows/python-tools\.yml|\.pre-commit-config\.yaml)$
